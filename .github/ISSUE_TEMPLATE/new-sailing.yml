name: "🚢 ส่งข้อมูลเที่ยวเรือ (Laem Chabang → Shanghai)"
description: "แจ้งเพิ่มเที่ยวเรือใหม่ หรือแก้ไขเที่ยวเรือที่มีอยู่ในตาราง Laem Chabang → Shanghai"
title: "[Sailing] "
labels: ["sailing-submission"]
body:
  - type: markdown
    attributes:
      value: |
        ขอบคุณที่ช่วยส่งข้อมูล! กรอกให้ครบเท่าที่ทราบ แล้วกด **Submit new issue**
        ทีมงานจะนำไปตรวจและใส่ในตารางรวม ([ดูตาราง](https://narisaram.github.io/shanghai-service/laem-chabang-shanghai/))

        Thanks for contributing! Fill in what you know and click **Submit new issue**.

  - type: dropdown
    id: kind
    attributes:
      label: "ประเภท / Type"
      options:
        - "เพิ่มเที่ยวเรือใหม่ (new sailing)"
        - "แก้ไข/อัปเดตเที่ยวที่มีอยู่ (correction to an existing sailing)"
        - "แจ้งเที่ยวเรือที่ถูกยกเลิก (sailing cancelled / blanked)"
    validations:
      required: true

  - type: dropdown
    id: carrier
    attributes:
      label: "สายเรือ / Carrier"
      options:
        - "SITC"
        - "T.S. Lines"
        - "KMTC"
        - "HAL (Heung-A)"
        - "ZIM"
        - "CU Lines"
        - "COSCO"
        - "Yang Ming (YML)"
        - "SJJ"
        - "อื่น ๆ (ระบุใน Remarks)"
    validations:
      required: true

  - type: input
    id: vessel
    attributes:
      label: "ชื่อเรือ / Vessel name"
      placeholder: "เช่น INFINITY"
    validations:
      required: true

  - type: input
    id: voyage
    attributes:
      label: "เที่ยว / Voyage no."
      placeholder: "เช่น 2637N"
    validations:
      required: true

  - type: input
    id: etd
    attributes:
      label: "ETD Laem Chabang (วันออกจากแหลมฉบัง)"
      description: "รูปแบบ YYYY-MM-DD"
      placeholder: "2026-09-21"
    validations:
      required: true

  - type: input
    id: eta
    attributes:
      label: "ETA Shanghai (วันถึงเซี่ยงไฮ้)"
      description: "รูปแบบ YYYY-MM-DD"
      placeholder: "2026-10-03"
    validations:
      required: true

  - type: input
    id: transit
    attributes:
      label: "Transit time (วัน / days)"
      placeholder: "12"
    validations:
      required: false

  - type: input
    id: source
    attributes:
      label: "ที่มาของข้อมูล / Source"
      description: "ลิงก์หน้า schedule ของสายเรือ, booking confirmation, อีเมล ฯลฯ"
      placeholder: "https://... หรือ ‘จาก booking confirmation ของสายเรือ’"
    validations:
      required: false

  - type: textarea
    id: remarks
    attributes:
      label: "หมายเหตุ / Remarks"
      description: "ถ้าเป็นการแก้ไข ให้ระบุว่าข้อมูลเดิมผิดตรงไหน / ควรเป็นอะไร"
      placeholder: "เช่น ตารางเดิมขึ้น ETD 2026-09-20 แต่จริง ๆ เลื่อนเป็น 2026-09-22"
    validations:
      required: false

  - type: input
    id: contact
    attributes:
      label: "ผู้แจ้ง / Contact (ไม่บังคับ)"
      description: "ชื่อ บริษัท หรืออีเมล เผื่อทีมงานต้องสอบถามเพิ่ม"
      placeholder: "ชื่อ / บริษัท / อีเมล"
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: "ยืนยัน"
      options:
        - label: "ข้อมูลนี้เป็นเส้นทาง Laem Chabang → Shanghai และตรวจแล้วว่าถูกต้องเท่าที่ทราบ"
          required: true
